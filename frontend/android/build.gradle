// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

/*
 * Dieselben Build-Tools für die Bausteine (Capacitor, Plugins) wie für die App.
 * Ohne das verlangt jeder die Voreinstellung seines Gradle-Plugins und Gradle
 * versucht, sie nachzuladen — in ein SDK, das (wie unter Visual Studio) oft
 * schreibgeschützt ist.
 */
subprojects {
    plugins.withId('com.android.library') {
        android { buildToolsVersion = rootProject.ext.buildToolsVersion }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
