apply plugin: 'com.android.application'

/*
 * FASSUNG UND UNTERSCHRIFT (Kapitel 13.5) — festgelegt vor der ersten
 * Auslieferung, weil keines von beiden sich danach noch ändern lässt.
 *
 *   applicationId  pl.recreatio.app
 *   versionName    die Fassung aus package.json + Zeitpunkt des Baus (UTC),
 *                  z. B. 0.1.0+20260930.1412
 *   versionCode    Minuten seit 2026-01-01 UTC. Steigt mit jedem Bau von
 *                  selbst — eine APK ersetzt die vorige nur, wenn ihre Zahl
 *                  grösser ist —, und bleibt für Jahrtausende unter 2^31.
 *                  `-PversionCode=…` setzt sie von Hand.
 *
 * Die UNTERSCHRIFT liegt nicht in diesem Verzeichnis. Wer den Schlüssel
 * verliert, kann die App nie wieder aktualisieren — und wer ihn aus dem
 * Repository liest, kann eine eigene ausliefern, die das Telefon für diese
 * hält. Deshalb liegt er dort, wo `npm run android:keystore` ihn anlegt:
 *
 *   ~/.recreatio/android/signing.properties   (oder $RECREATIO_SIGNING)
 */

def web = new groovy.json.JsonSlurper().parse(file('../../package.json'))

def builtAt = new Date()
def minutesSince2026 = (int) ((builtAt.time - 1767225600000L).intdiv(60000L))
def versionCodeValue = project.hasProperty('versionCode') ? project.property('versionCode').toString().toInteger() : minutesSince2026
def versionNameValue = "${web.version}+${builtAt.format('yyyyMMdd.HHmm', TimeZone.getTimeZone('UTC'))}"

def signingFile = file(System.getenv('RECREATIO_SIGNING') ?: "${System.getProperty('user.home')}/.recreatio/android/signing.properties")
def signing = new Properties()
if (signingFile.exists()) {
    signingFile.withInputStream { signing.load(it) }
}

/*
 * PUSH (0075) — Firebase Cloud Messaging, OHNE das Google-Services-Plugin.
 *
 * Die Kennungen des Firebase-Projekts stehen in `google-services.json` (aus
 * der Firebase-Konsole, App „pl.recreatio.app"). Sie liegt neben dieser Datei
 * oder dort, wohin $RECREATIO_FIREBASE zeigt; der Bau liest daraus vier Werte
 * in BuildConfig, und `PushSetup` startet Firebase damit von Hand. Fehlt die
 * Datei, baut die App ohne Push — sie fragt dann im Takt wie bisher.
 */
def firebaseFile = file(System.getenv('RECREATIO_FIREBASE') ?: 'google-services.json')
def firebase = [appId: '', apiKey: '', projectId: '', senderId: '']
if (firebaseFile.exists()) {
    def services = new groovy.json.JsonSlurper().parse(firebaseFile)
    def client = services.client.find { it.client_info?.android_client_info?.package_name == 'pl.recreatio.app' }
    if (client != null) {
        firebase = [
            appId: client.client_info.mobilesdk_app_id ?: '',
            apiKey: (client.api_key && client.api_key.size() > 0) ? client.api_key[0].current_key : '',
            projectId: services.project_info.project_id ?: '',
            senderId: services.project_info.project_number ?: ''
        ]
    }
}

android {
    namespace = "pl.recreatio.app"
    compileSdk = rootProject.ext.compileSdkVersion
    /* Fest, damit Gradle nicht versucht, eine andere Fassung in ein schreibgeschütztes SDK nachzuladen. */
    buildToolsVersion = rootProject.ext.buildToolsVersion
    defaultConfig {
        applicationId "pl.recreatio.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeValue
        versionName versionNameValue
        buildConfigField "String", "FCM_APP_ID", "\"${firebase.appId}\""
        buildConfigField "String", "FCM_API_KEY", "\"${firebase.apiKey}\""
        buildConfigField "String", "FCM_PROJECT_ID", "\"${firebase.projectId}\""
        buildConfigField "String", "FCM_SENDER_ID", "\"${firebase.senderId}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile new File(signingFile.parentFile, signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
            /* v3 dazu: erlaubt später, den Schlüssel zu wechseln, ohne dass installierte Apps ihn verlieren. */
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        release {
            if (signingFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    /*
     * Kein Abhängigkeitsverzeichnis in der APK. Es ist mit einem Schlüssel von
     * Google verschlüsselt und nur für Google lesbar — auf einem Telefon ohne
     * Google-Dienste hat es nichts verloren.
     */
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    /* 0075 — BuildConfig trägt die Kennungen des Firebase-Projekts (s. oben). */
    buildFeatures {
        buildConfig = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    /* 0067 — der Arbeiter, der bei geschlossener App nach Neuem fragt (NotifyWorker). */
    implementation 'androidx.work:work-runtime:2.10.5'
    /* 0075 — der Wecker (Firebase Cloud Messaging); ohne google-services.json bleibt er stumm. */
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'
